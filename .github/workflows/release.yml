# Publishes a release when catflap/version.py changes on main (or when a vX.Y
# tag is pushed, or when started by hand). If release vX.Y already exists,
# nothing is built. GitHub creates the vX.Y tag on the released commit.
#
# Every asset carries the version in its name: catflap-X.Y.tar.gz,
# catflap-X.Y-py3-none-any.whl, catflap-X.Y-1.noarch.rpm, catflap-X.Y.flatpak,
# catflap-X.Y-setup.exe (Windows).
# All releases and assets are kept: release files don't count against Actions
# or Packages storage. The only Actions storage used is the files passed
# between jobs (expire after one day). No caches, no GitHub Packages.
name: release
on:
  push:
    branches: [main]
    paths: ["catflap/version.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 scripts/bump_version.py --check)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/bump_version.py --tag "$GITHUB_REF_NAME"
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q build pytest keyring cryptography
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  windows-tests:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -e ".[test]"
      - run: python -m pytest -q

  rpm:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: >
          dnf install -y -q rpm-build python3-devel pyproject-rpm-macros python3-pytest
          python3-setuptools python3-pip python3-wheel python3-packaging desktop-file-utils
          python3-keyring python3-cryptography
      # dist tag left out so the file is simply catflap-X.Y-1.noarch.rpm
      - run: rpmbuild -bb packaging/rpm/catflap.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpm" --define "dist %{nil}"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpm/noarch/*.rpm
          retention-days: 1

  flatpak:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder, KDE SDK and PySide base app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11 io.qt.PySide.BaseApp//6.11
      - name: Build bundle
        run: |
          v="${{ needs.meta.outputs.version }}"
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.samschultzponsys.CatFlap.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "catflap-${v}.flatpak" io.github.samschultzponsys.CatFlap master
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"
          retention-days: 1

  windows-installer:
    needs: [meta, windows-tests]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build CatFlap.exe and catflap.exe
        shell: pwsh
        run: |
          python -m pip install -q pyinstaller pillow PySide6-Essentials keyring cryptography
          python packaging/windows/make_ico.py packaging/windows/catflap.ico
          pyinstaller --noconfirm packaging/windows/catflap.spec
          dist\CatFlap\catflap-cli.exe version
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ needs.meta.outputs.version }}" packaging\windows\catflap.iss
          Get-ChildItem dist-win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-win/*.exe
          retention-days: 1

  publish:
    needs: [meta, build, windows-tests, rpm, flatpak, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create GitHub release (and the vX.Y tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.meta.outputs.version }}"
          ls -la out
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          notes="${notes}"$'\n\n'"**Windows:** catflap-$v-setup.exe is a preview. Install [WireGuard for Windows](https://www.wireguard.com/install/) first."
          gh release create "v$v" out/* --target "$GITHUB_SHA" --title "CatFlap $v" --notes "${notes:-See CHANGELOG.md}"
