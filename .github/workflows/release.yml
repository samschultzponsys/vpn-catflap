# Runs only when a version tag (vMAJOR.MINOR) is pushed. Every asset carries the
# version in its name: catflap-X.Y.tar.gz, catflap-X.Y-py3-none-any.whl,
# catflap-X.Y-1.noarch.rpm, catflap-X.Y.flatpak (~12 MB). Release assets don't
# count against Actions/Packages storage; the only Actions storage used is
# workflow artifacts handed between jobs, which expire after one day. No
# caches and no GitHub Packages are used.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match catflap/version.py (MAJOR.MINOR, minor 0-9)
        run: python scripts/bump_version.py --tag "${GITHUB_REF_NAME}" && python scripts/bump_version.py --check
      - run: python -m pip install build pytest keyring cryptography
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -e ".[test]"
      - run: python -m pytest -q

  rpm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: >
          dnf install -y rpm-build python3-devel pyproject-rpm-macros python3-pytest
          python3-setuptools python3-pip python3-wheel python3-packaging desktop-file-utils
          python3-keyring python3-cryptography
      # dist tag left out so the file is simply catflap-X.Y-1.noarch.rpm
      - run: rpmbuild -bb packaging/rpm/catflap.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpm" --define "dist %{nil}"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpm/noarch/*.rpm
          retention-days: 1

  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder, KDE SDK and PySide base app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11 io.qt.PySide.BaseApp//6.11
      - name: Build bundle
        run: |
          v="${GITHUB_REF_NAME#v}"
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.samschultzponsys.CatFlap.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "catflap-${v}.flatpak" io.github.samschultzponsys.CatFlap master
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"
          retention-days: 1

  publish:
    needs: [build, windows-tests, rpm, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/* --title "catflap ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}"
