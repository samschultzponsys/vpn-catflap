<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- catflap app icon: a cat peeking through a cat flap. Apache-2.0, see NOTICE. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <clipPath id="door">
      <rect x="27" y="31" width="74" height="72" rx="15"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#tile)"/>

  <!-- door opening -->
  <rect x="27" y="31" width="74" height="72" rx="15" fill="#0B1220"/>

  <!-- the flap, swung open towards the viewer -->
  <path d="M33 41 L95 41 L99 31 L29 31 Z" fill="#475569" clip-path="url(#door)"/>

  <!-- cat head coming through -->
  <g clip-path="url(#door)">
    <path d="M38 103 L38 74 Q38 66 42 62 L44 49 L56 59 Q64 56.5 72 59 L84 49 L86 62 Q90 66 90 74 L90 103 Z"
          fill="url(#cat)"/>
    <!-- inner ears -->
    <path d="M46 54 L47 61 L52 59 Z" fill="#14532D" opacity="0.55"/>
    <path d="M82 54 L81 61 L76 59 Z" fill="#14532D" opacity="0.55"/>
    <!-- eyes -->
    <ellipse cx="54" cy="77" rx="4.2" ry="5.4" fill="#0F172A"/>
    <ellipse cx="74" cy="77" rx="4.2" ry="5.4" fill="#0F172A"/>
    <circle cx="55.4" cy="75.2" r="1.4" fill="#ECFDF5"/>
    <circle cx="75.4" cy="75.2" r="1.4" fill="#ECFDF5"/>
    <!-- nose and mouth -->
    <path d="M61 85 L67 85 L64 88.5 Z" fill="#0F172A"/>
    <path d="M64 88.5 Q61 92 58 90 M64 88.5 Q67 92 70 90" fill="none" stroke="#0F172A"
          stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- door frame and hinge -->
  <rect x="27" y="31" width="74" height="72" rx="15" fill="none" stroke="#CBD5E1" stroke-width="6"/>
  <line x1="35" y1="41" x2="93" y2="41" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
</svg>
